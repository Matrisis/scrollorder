[project]
name = "scrollorder"
version = "0.1.0"
description = "2D test of ordered-surface graph cuts and integer-shift barcodes for scroll unwrapping"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy>=1.8", "tifffile", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]
real = ["zarr>=3"]

[tool.setuptools]
packages = ["scrollorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
